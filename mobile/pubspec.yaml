name: mobile
description: "AI Travel Copilot - Intelligent Personal Travel Assistant"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Networking & HTTP
  dio: ^5.4.3+1

  # Storage & Offline Cache
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # UI, Typography & Animations
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  flutter_markdown: ^0.7.2
  intl: ^0.19.0
  uuid: ^4.4.0

  # Maps & Geolocation
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
